$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "faker@riftcampus.com",
      "contrasena": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = pm.response.json();
      pm.collectionVariables.set("token", res.token);
    language: text/javascript
examples: ./.resources/Iniciar sesión.resources/examples
order: 2000
