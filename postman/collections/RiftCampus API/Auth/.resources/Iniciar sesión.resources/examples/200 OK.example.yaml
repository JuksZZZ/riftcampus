$kind: http-example
request:
  url: "{{base_url}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "faker@riftcampus.com",
        "contrasena": "123456"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "token": "<jwt>",
        "has_profile": false,
        "user": {
          "id_usuario": 1,
          "nombre": "Faker",
          "rol_usuario": "usuario"
        }
      }
order: 1000
