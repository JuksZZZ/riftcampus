$kind: http-example
request:
  url: "{{base_url}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "faker@riftcampus.com",
        "contrasena": "123456"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: '{ "error": "Credenciales incorrectas." }'
order: 3000
