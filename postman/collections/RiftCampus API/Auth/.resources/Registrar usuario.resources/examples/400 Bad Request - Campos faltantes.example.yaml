$kind: http-example
request:
  url: "{{base_url}}/api/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "nombre": "Faker",
        "email": "faker@riftcampus.com",
        "contrasena": "123456"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: '{ "error": "Nombre, email y contraseña son obligatorios." }'
order: 2000
