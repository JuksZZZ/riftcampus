$kind: http-example
request:
  url: "{{base_url}}/api/matches?page=1&limit=10"
  method: GET
  headers:
    Authorization: Bearer {{token}}
  queryParams:
    page: "1"
    limit: "10"
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: '{ "error": "Token no proporcionado." }'
order: 3000
