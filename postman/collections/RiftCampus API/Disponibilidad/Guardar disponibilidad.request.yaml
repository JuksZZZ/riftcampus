      "franjas": [
        { "dia": "lun", "hora_inicio": "18:00", "hora_fin": "22:00" },
        { "dia": "mie", "hora_inicio": "20:00", "hora_fin": "23:00" },
        { "dia": "sab", "hora_inicio": "14:00", "hora_fin": "20:00" }
      ]
    }
examples: ./.resources/Guardar disponibilidad.resources/examples
order: 3000
