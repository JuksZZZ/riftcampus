$kind: http-example
request:
  url: "{{base_url}}/api/swipe"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_swiped": 2,
        "accion": "like"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: '{ "ok": true, "es_match": false }'
order: 1000
