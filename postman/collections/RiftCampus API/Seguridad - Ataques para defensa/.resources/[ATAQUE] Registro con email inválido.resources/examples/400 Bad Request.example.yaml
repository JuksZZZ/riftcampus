$kind: http-example
request:
  url: "{{base_url}}/api/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: '{ "nombre": "Test", "email": "no-es-un-email", "contrasena": "123456" }'
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: '{ "error": "El email no tiene un formato válido." }'
order: 1000
