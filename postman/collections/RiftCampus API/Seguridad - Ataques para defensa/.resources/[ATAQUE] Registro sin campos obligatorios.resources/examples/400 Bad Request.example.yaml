$kind: http-example
request:
  url: "{{base_url}}/api/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: '{ "email": "test@test.com" }'
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: '{ "error": "Nombre, email y contraseña son obligatorios." }'
order: 1000
